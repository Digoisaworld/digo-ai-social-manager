services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: digo_social
      POSTGRES_USER: digo
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - digo_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U digo -d digo_social"]
      interval: 10s
      timeout: 5s
      retries: 10
  social-manager:
    build: .
    restart: unless-stopped
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./media:/app/media
    ports:
      - "127.0.0.1:8097:8000"
volumes:
  digo_pgdata:
